name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Full CI Validation (Audit, Typecheck, Lint, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install -g npm@latest
          npm ci

      - name: Security Vulnerability Audit
        run: npm run audit

      - name: TypeScript Strict Type Check
        run: npm run typecheck

      - name: ESLint Strict Check (Zero Warnings Allowed)
        run: npm run lint -- --max-warnings=0

      - name: Vitest Unit & Integration Tests
        run: npm test

      - name: Next.js Production Build
        run: npm run build
        env:
          NODE_ENV: production
          SESSION_SECRET: ci-dummy-session-secret-at-least-32-chars-long
