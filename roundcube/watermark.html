<!DOCTYPE html>
<html class="dark-mode">
<head>
<meta charset="UTF-8">
<title></title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style type="text/css">
html, body { 
  height: 100%; 
  margin: 0; 
  padding: 0; 
  overflow: hidden; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background-color: #1f1f1f;
  color: #726f69;
}
.watermark-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  user-select: none;
  opacity: 0.45;
  transition: opacity 0.2s ease;
}
.watermark-container:hover {
  opacity: 0.75;
}
.brand-mark {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 40px;
  font-weight: 200;
  color: #f2f2f2;
  letter-spacing: -0.02em;
}
.watermark-text {
  font-size: 13px;
  font-weight: 500;
  color: #9e9e9e;
  letter-spacing: 0.01em;
}
html:not(.dark-mode) {
  background-color: #faf9f5;
}
html:not(.dark-mode) body {
  background-color: #faf9f5;
  color: #726f69;
}
html:not(.dark-mode) .brand-mark {
  color: #2c2b29;
}
html:not(.dark-mode) .watermark-text {
  color: #726f69;
}
</style>
<script>
  try {
    if (document.cookie.indexOf('colorMode=light') > -1) {
      document.documentElement.className = '';
    } else {
      document.documentElement.className = 'dark-mode';
    }
  } catch (e) { }
</script>
</head>
<body>
  <div class="watermark-container">
    <span class="brand-mark">mailwart</span>
    <span class="watermark-text">Select a conversation to read</span>
  </div>
</body>
</html>
