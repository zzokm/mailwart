# mailwart — Dokploy project: Email — compose service: email-manager
# Product brand: mailwart. Image/service names stay `email-manager` (historical).
# Domain: email.yehia.dev → dashboard :3000; Roundcube at /webmail
#
# Source: https://github.com/zzokm/yehia-email-manager (GitHub App auto-deploy on push to main)
# Dokploy clones this repo and runs `docker compose up --build`.
#
# JMAP: in-cluster URL reaches Stalwart on the shared compose network.
# Public https://mail.yehia.dev/jmap also works if internal DNS fails.
# Secrets stay in Dokploy compose env — never commit them.

services:
  email-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: email-manager:latest
    container_name: email-manager
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (r) => {process.exit(r.statusCode < 500 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      STALWART_JMAP_URL: ${STALWART_JMAP_URL:-http://stalwart-mail:8080/jmap}
      STALWART_ADMIN_USER: ${STALWART_ADMIN_USER}
      STALWART_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD}
      STALWART_ADMIN_UI_URL: ${STALWART_ADMIN_UI_URL:-https://mail.yehia.dev/admin}
      ROUNDCUBE_URL: ${ROUNDCUBE_URL:-https://email.yehia.dev/webmail/}
      WEBMAIL_SSO_SECRET: ${WEBMAIL_SSO_SECRET}
      APP_ADMIN_USER: ${APP_ADMIN_USER:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      DNS_EXPECTED_MX: ${DNS_EXPECTED_MX:-}
      DNS_DKIM_SELECTORS: ${DNS_DKIM_SELECTORS:-}
      DNS_EXPECTED_SPF: ${DNS_EXPECTED_SPF:-}
      AUDIT_LOG_PATH: ${AUDIT_LOG_PATH:-/data/audit.jsonl}
      # Copilot (Architecture §16.5). Compose only forwards vars named here —
      # setting them in the Dokploy UI alone is not enough.
      COPILOT_PROVIDER: ${COPILOT_PROVIDER:-}
      COPILOT_MODEL: ${COPILOT_MODEL:-}
      COPILOT_API_KEY: ${COPILOT_API_KEY:-}
      COPILOT_BASE_URL: ${COPILOT_BASE_URL:-}
      COPILOT_SETTINGS_PATH: ${COPILOT_SETTINGS_PATH:-/data/copilot-settings.json}
      COPILOT_HISTORY_PATH: ${COPILOT_HISTORY_PATH:-/data/copilot-history}
      COPILOT_OPENAI_API_KEY: ${COPILOT_OPENAI_API_KEY:-}
      COPILOT_ANTHROPIC_API_KEY: ${COPILOT_ANTHROPIC_API_KEY:-}
      COPILOT_GOOGLE_API_KEY: ${COPILOT_GOOGLE_API_KEY:-}
      COPILOT_CEREBRAS_API_KEY: ${COPILOT_CEREBRAS_API_KEY:-}
      COPILOT_GROQ_API_KEY: ${COPILOT_GROQ_API_KEY:-}
      COPILOT_MISTRAL_API_KEY: ${COPILOT_MISTRAL_API_KEY:-}
      COPILOT_DEEPSEEK_API_KEY: ${COPILOT_DEEPSEEK_API_KEY:-}
      COPILOT_MOONSHOT_API_KEY: ${COPILOT_MOONSHOT_API_KEY:-}
      COPILOT_OLLAMA_API_KEY: ${COPILOT_OLLAMA_API_KEY:-}
      COPILOT_OPENROUTER_API_KEY: ${COPILOT_OPENROUTER_API_KEY:-}
      COPILOT_OPENAI_BASE_URL: ${COPILOT_OPENAI_BASE_URL:-}
      COPILOT_ANTHROPIC_BASE_URL: ${COPILOT_ANTHROPIC_BASE_URL:-}
      COPILOT_GOOGLE_BASE_URL: ${COPILOT_GOOGLE_BASE_URL:-}
      COPILOT_CEREBRAS_BASE_URL: ${COPILOT_CEREBRAS_BASE_URL:-}
      COPILOT_GROQ_BASE_URL: ${COPILOT_GROQ_BASE_URL:-}
      COPILOT_MISTRAL_BASE_URL: ${COPILOT_MISTRAL_BASE_URL:-}
      COPILOT_DEEPSEEK_BASE_URL: ${COPILOT_DEEPSEEK_BASE_URL:-}
      COPILOT_MOONSHOT_BASE_URL: ${COPILOT_MOONSHOT_BASE_URL:-}
      COPILOT_OLLAMA_BASE_URL: ${COPILOT_OLLAMA_BASE_URL:-}
      COPILOT_OPENROUTER_BASE_URL: ${COPILOT_OPENROUTER_BASE_URL:-}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    volumes:
      - mailwart_audit:/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.email-manager.rule=Host(`email.yehia.dev`)
      - traefik.http.routers.email-manager.entrypoints=websecure
      - traefik.http.routers.email-manager.tls.certresolver=letsencrypt
      - traefik.http.routers.email-manager.priority=1
      - traefik.http.routers.email-manager.service=email-manager
      - traefik.http.services.email-manager.loadbalancer.server.port=3000
    networks:
      - default
      - dokploy-network
      - stalwart-net

  roundcube:
    build:
      context: ./roundcube
      dockerfile: Dockerfile
    image: email-manager-roundcube:latest
    container_name: email-manager-roundcube
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://stalwart-mail
      ROUNDCUBEMAIL_DEFAULT_PORT: "993"
      ROUNDCUBEMAIL_SMTP_SERVER: tls://stalwart-mail
      ROUNDCUBEMAIL_SMTP_PORT: "587"
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload,managesieve,em_sso
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_MANAGESIEVE_HOST: tls://stalwart-mail
      ROUNDCUBEMAIL_MANAGESIEVE_PORT: "4190"
      ROUNDCUBEMAIL_REQUEST_PATH: /webmail/
      ROUNDCUBEMAIL_DES_KEY: ${ROUNDCUBE_DES_KEY}
      WEBMAIL_SSO_SECRET: ${WEBMAIL_SSO_SECRET}
      WEBMAIL_IMPERSONATOR_USER: ${WEBMAIL_IMPERSONATOR_USER:-${STALWART_ADMIN_USER}}
      WEBMAIL_IMPERSONATOR_PASSWORD: ${WEBMAIL_IMPERSONATOR_PASSWORD:-${STALWART_ADMIN_PASSWORD}}
    volumes:
      - roundcube_db:/var/roundcube/db
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.email-manager-webmail.rule=Host(`email.yehia.dev`) && PathPrefix(`/webmail`)
      - traefik.http.routers.email-manager-webmail.entrypoints=websecure
      - traefik.http.routers.email-manager-webmail.tls.certresolver=letsencrypt
      - traefik.http.routers.email-manager-webmail.priority=100
      - traefik.http.routers.email-manager-webmail.middlewares=email-manager-webmail-strip
      - traefik.http.routers.email-manager-webmail.service=email-manager-webmail
      - traefik.http.middlewares.email-manager-webmail-strip.stripprefix.prefixes=/webmail
      - traefik.http.services.email-manager-webmail.loadbalancer.server.port=80
    networks:
      - default
      - dokploy-network
      - stalwart-net

networks:
  dokploy-network:
    external: true
  stalwart-net:
    name: email-stalwart-y2hydv_default
    external: true

volumes:
  roundcube_db:
  mailwart_audit:
